ly="sans-serif" font-size="13" lengthAdjust="spacing" textLength="178" x="682" y="622.7217">Indl&#230;ses direkte i fagsystemet</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="156" x="682" y="639.0732">uden behov for konvertering</text><rect fill="#DDDDDD" height="62.8281" id="_legend" rx="7.5" ry="7.5" style="stroke:#000000;stroke-width:1.0;" width="849" x="53" y="55.6094"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="66" x="58" y="75.1426">Scenarie:</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="673" x="128" y="75.1426">&#198;ldre l&#230;gesystem (OIOXML) sender via sin VANS-leverand&#248;r til et moderne modtagersystem (FHIR nativt).</text><ellipse cx="63.5" cy="88.3281" fill="#000000" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:0.0;"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="182" x="70" y="92.752">Afsenderside (Variant A3):</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="514" x="256" y="92.752">VANS-leverand&#248;rens indbyggede MSH opgraderer beskeden fra OIOXML til FHIR.</text><ellipse cx="63.5" cy="105.9375" fill="#000000" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:0.0;"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="190" x="70" y="110.3613">Modtagerside (Variant M1):</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="633" x="264" y="110.3613">Modtagerens EUA har indbygget MSH og indl&#230;ser den rene FHIR-besked direkte uden konvertering.</text><!--SRC=[TLH1Rjim4Bpp5OlqOiMnWw0jsXf80HM84QDr7DXjq4E1W9PMD66QSadQQ3xGdwHloDqVwv8I9JbDBn90xkxCpkoIxrofTvib6cRNKc-vuHkmxa4XVOtCt6wZkZVuSuSwmobQomMcIWeD6Mf7-Sn9HscVoyro2Ez6CA5JOT2WW