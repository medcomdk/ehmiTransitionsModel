 x="218" y="75.1426">Moderne kommunalt fagsystem (FHIR nativt) sender til et hospital med &#230;ldre EPJ bag en regional servicebus.</text><ellipse cx="153.5" cy="88.3281" fill="#000000" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:0.0;"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="182" x="160" y="92.752">Afsenderside (Variant A1):</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="455" x="346" y="92.752">EUA har indbygget MSH, taler FHIR nativt og springer konvertering over.</text><ellipse cx="153.5" cy="105.9375" fill="#000000" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:0.0;"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="190" x="160" y="110.3613">Modtagerside (Variant M2):</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="564" x="354" y="110.3613">Hospitalets Standalone MSH opfanger FHIR-beskeden og mapper den til EDIFACT til EPJ.</text><!--SRC=[XLJRRjD047ttLupWWIGbgLg11950Cf2eQPKIEQLFIDNQ7czMMU-QtNL4FuZ-I7-CMT_Yf2sy9BPtvioPCsU7bKwhCe_H17OhLC4Coy6wUudqQqJYobpsJ_1NYIh19LhBE8PIS0K9AaVvWHEEqgvq7a_WV0eB-ieD6dGm-n6UBDSNC0WpYof5CuJnPrWxfb8cjKAe3fSwTGHgXa4WaLCSE5q40AFHcaem8t0w6W55eQ6KhSxpKZ7f86FStbk7EGpc5ui857DYvuPGbm8d9127ZRQ5S4n2ZYayFiZK8CnMbn0p3gZ081UQu2ZBx4I2SMadlZPLRqbRaI8CRea8Kmx2iw6dGwt1XXaGAetlEQT2rCjRe49KkaS7D0TR6A6eGUAkTcX8D7e5JOzjgLQ2mrBBywhKHTC1EdkidIuoLY7xYkCOxHPJQefgvgmewBj_yqBClYtcuTUR-dbrEGceirhi88ZrRtZrKhFFpNFu2bxFtyq_pByGVG2ME6ts29Kq9vxUJrKFvjehGKcC-D_HwHsTLPbaBYSIKVXI-_nmTNeRNg-R-73bkGAH38A3-DaigaBel-dX9HMdHx9L_3_Ety_3fonQZ0CMaMVn9FGGj0biMsj4wU2eRPAZ6SEm2QQF- -OeG-oOmvv6tPE_DjGdJE5xOIKvjtZy0tcBpUtPH1j-ogKAVDJONx8kTGeTYLKPIv5ygeOoM3ANR6fcRr1PG6_YJ9kSERg9IXCJ8_Y679mTZ6qqMZ5hnsvZTCatC5YG0PNtco9NUyDIZBT0VHMOf5yo9JdH8sMqCsXv8CMKwGwtLbAIhQlMrtZON9nA6C_YK0Ll22y3NPxKi2Fh1oa-es9VMPfZXK18KOrqOvYoXVQtybzWb